name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Everything that does not need the harness: data loaders, scripts, store.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Harness-independent tests (no GPU, no tokens)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -q

  safety:
    # The claim this repository makes is that the harness stops the model
    # shipping a diagnosis. This job checks that claim with the real harness and
    # fails, rather than skips, when the harness cannot be loaded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MoleCare/skin-care-harness
          # Read-only deploy key on MoleCare/skin-care-harness; the default token
          # cannot read another private repository. Private half lives only here.
          ssh-key: ${{ secrets.HARNESS_DEPLOY_KEY }}
          path: skin-care-harness
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Safety tests against the real harness
        env:
          PYTHONPATH: src
          SKIN_CARE_HARNESS_PYTHON: ${{ github.workspace }}/skin-care-harness/packages/python
          SKIN_CARE_HARNESS_REQUIRED: "1"
        run: python -m unittest tests.test_skincare_guard -v
